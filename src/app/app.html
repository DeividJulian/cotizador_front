@if (auth.user(); as user) {
  <div class="app">
    <header class="topbar">
      <a class="brand" routerLink="/">
        <span class="brand__mark"><app-icon name="brand" /></span>
        <span>Cotizador <span class="brand__ai">IA</span></span>
      </a>
      <nav class="nav" aria-label="Principal">
        <a class="nav__link" routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
          <app-icon name="dashboard" />Panel
        </a>
        <a class="nav__link" routerLink="/cotizaciones" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          <app-icon name="quotes" />Mis cotizaciones
        </a>
        <a class="nav__link" routerLink="/tarifas" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          <app-icon name="money" />Mis tarifas
        </a>
      </nav>
      <div class="topbar__right">
        <div class="user">
          <span class="avatar" aria-hidden="true">{{ initials(user.name) }}</span>
          <span class="user__name">{{ user.name }}</span>
        </div>
        <button class="btn btn--ghost btn--sm" type="button" (click)="auth.logout()">
          <app-icon name="logout" /><span class="hide-mobile">Cerrar sesión</span>
        </button>
      </div>
    </header>

    <router-outlet />
    <app-connection-status />
  </div>
} @else {
  <router-outlet />
}

<app-toasts />
