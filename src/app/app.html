@if (auth.user(); as user) {
  <header class="topbar">
    <a class="brand" routerLink="/">
      <span class="logo">$</span>
      <span>AI Quoter</span>
    </a>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/cotizaciones" routerLinkActive="active">My quotes</a>
      <a routerLink="/tarifas" routerLinkActive="active">My rates</a>
    </nav>
    <span class="spacer"></span>
    <div class="account">
      @if (user.foto_url) {
        <img class="avatar" [src]="user.foto_url" alt="" referrerpolicy="no-referrer" />
      }
      <span class="small"><strong>{{ user.nombre }}</strong></span>
      <button class="btn small" type="button" (click)="auth.logout()">Log out</button>
    </div>
  </header>
}

<main>
  <router-outlet />
</main>

<app-connection-status />
<app-toasts />
