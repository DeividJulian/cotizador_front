<div class="card">
  <div class="row" style="margin-bottom: 12px">
    <h2 style="margin: 0">Commercial proposal</h2>
    <span class="spacer"></span>
    @if (canGenerate) {
      <button class="btn primary small" type="button" (click)="generate()" [disabled]="busy()">
        {{ busy() ? 'Generating…' : quote().propuesta ? 'Regenerate proposal' : 'Generate proposal' }}
      </button>
    }
    @if (quote().propuesta) {
      <button class="btn small" type="button" (click)="download()">Download .md</button>
      <button class="btn small" type="button" (click)="print()">Print</button>
    }
  </div>

  @if (quote().propuesta) {
    <div class="markdown" [innerHTML]="html()"></div>
  } @else {
    <div class="empty">
      There is no proposal yet.
      @if (canGenerate) { Click <strong>Generate proposal</strong>. } @else { Analyze the quote first. }
    </div>
  }
</div>
