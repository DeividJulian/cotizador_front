<section class="page auth-page">
  <div class="card form">
    <p class="eyebrow">AI Quoter</p>
    @if (sentTo(); as email) {
      <h1>Check your email</h1>
      <app-code-step [email]="email" (verified)="enter()" (back)="sentTo.set(null)" />
    } @else {
      <h1>Log in</h1>
      <p class="subtle small">Enter your email and we will send you a 6-digit code. No password needed.</p>
      <form class="form" [formGroup]="form" (ngSubmit)="requestCode()">
        <label>
          Email
          <input type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="error-text">Enter a valid email.</span>
          }
        </label>
        <button class="btn primary" type="submit" [disabled]="sending()">{{ sending() ? 'Sending…' : 'Send me a code' }}</button>
      </form>
      <p class="small subtle">Don't have an account? <a routerLink="/registro">Sign up</a></p>
    }
  </div>
</section>
