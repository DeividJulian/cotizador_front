<form class="auth-card" novalidate (submit)="submit($event)">
  <span class="mail-badge"><app-icon name="mail" size="lg" /></span>
  <div>
    <h2 class="auth-card__title">Revisa tu correo</h2>
    <p class="auth-card__text">
      Te enviamos un código de 6 dígitos a <strong style="color: var(--text)">{{ email() }}</strong>. Vence en 10 minutos.
    </p>
  </div>

  <fieldset style="border: 0; padding: 0; margin: 0">
    <legend class="label" style="margin-bottom: 8px">Código de 6 dígitos</legend>
    <div class="otp" (paste)="onPaste($event)">
      @for (i of positions; track i) {
        <input
          #digit
          class="otp__input"
          [class.is-filled]="digits()[i]"
          inputmode="numeric"
          [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
          maxlength="6"
          [attr.aria-label]="'Dígito ' + (i + 1)"
          [disabled]="verifying()"
          (input)="onInput(i, $event)"
          (keydown)="onKeydown(i, $event)"
        />
      }
    </div>
    <p class="hint" style="margin-top: 8px">Consejo: puedes pegar el código completo.</p>
  </fieldset>

  <button class="btn btn--primary btn--lg btn--block" [class.is-loading]="verifying()" type="submit" [disabled]="!complete() || verifying()">
    Verificar y continuar
  </button>

  <div class="row row--between small">
    <button class="link-btn" type="button" (click)="resend()" [disabled]="cooldown() > 0 || resending()">
      {{ cooldown() > 0 ? 'Reenviar código en ' + cooldown() + ' s' : resending() ? 'Enviando…' : 'Reenviar código' }}
    </button>
    <button class="link-btn" type="button" (click)="back.emit()">Usar otro correo</button>
  </div>
  <p class="hint">¿No te llegó? Revisa la carpeta de spam.</p>
</form>
